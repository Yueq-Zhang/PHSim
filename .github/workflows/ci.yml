name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.build_type }} build and CTest
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Release
          - Debug

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            libblas-dev \
            libboost-dev

      - name: Configure ${{ matrix.build_type }} build
        run: >-
          cmake -S . -B build-${{ matrix.build_type }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-${{ matrix.build_type }} --parallel 2

      - name: Run tests
        run: >-
          ctest --test-dir build-${{ matrix.build_type }}
          --output-on-failure
